<header class="header">
  <div class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="#" aria-label="Games e Acessórios">
        <img src="/public/images/logo.png" alt="" />
      </a>

      <form class="search" role="search">
        <input
          type="search"
          placeholder="Busque por jogos, acessórios, consoles..."
          aria-label="Buscar"
        />
        <button type="submit" aria-label="Buscar">
          <i class="bx bx-search" aria-hidden="true"></i>
        </button>
      </form>

      <div class="actions">
        <a class="action action--extra" href="#">
          <i class="bx bx-package" aria-hidden="true"></i>
          <span class="action-text">Rastrear<br />Pedido</span>
        </a>
        <a class="action" href="#">
          <i class="bx bx-heart" aria-hidden="true"></i>
          <span class="action-text">Favoritos</span>
        </a>
        <a class="action action--extra" href="/src/login.html">
          <i class="bx bx-user" aria-hidden="true"></i>
          <span class="action-text">Minha<br />Conta</span>
        </a>
        <a class="action cart" href="/src/carrinho.html" aria-label="Carrinho">
          <span class="cart-icon">
            <i class="bx bx-cart" aria-hidden="true"></i>
            <span class="cart-badge">0</span>
          </span>
        </a>
      </div>
      <button
        class="burger"
        type="button"
        aria-expanded="false"
        aria-controls="mobile-panel"
        aria-label="Abrir menu"
      >
        <i class="bx bx-menu" aria-hidden="true"></i>
      </button>
    </div>
    <div class="mobile-panel" id="mobile-panel">
      <div class="container">
        <form class="mobile-search" role="search">
          <input
            type="search"
            placeholder="Busque por jogos, acessórios, consoles..."
            aria-label="Buscar"
          />
        </form>
        <nav class="mobile-nav" aria-label="Menu">
          <a href="/src/produtos.html?categoria=consoles"
            ><i class="bx bx-joystick-button" aria-hidden="true"></i>
            Consoles</a
          >
          <a href="/src/produtos.html?categoria=jogos"
            ><i class="bx bx-disc" aria-hidden="true"></i> Jogos</a
          >
          <a href="/src/produtos.html?categoria=acessorios"
            ><i class="bx bx-headphone" aria-hidden="true"></i>
            Acessórios</a
          >
          <a href="/src/produtos.html?categoria=pc-gamer"
            ><i class="bx bx-desktop" aria-hidden="true"></i> PC Gamer</a
          >
          <a href="/src/produtos.html?categoria=colecionaveis"
            ><i class="bx bx-trophy" aria-hidden="true"></i>
            Colecionáveis</a
          >
          <a href="/src/produtos.html"
            ><i class="bx bx-purchase-tag-alt" aria-hidden="true"></i>
            Ofertas</a
          >
          <a href="#"
            ><i class="bx bx-package" aria-hidden="true"></i> Rastrear
            Pedido</a
          >
          <a href="/src/login.html"
            ><i class="bx bx-user" aria-hidden="true"></i> Minha Conta</a
          >
        </nav>
      </div>
    </div>
  </div>

  <div class="subbar">
    <div class="container subbar-inner">
      <nav class="subnav" aria-label="Categorias">
        <a class="subitem" href="/src/produtos.html?categoria=consoles">
          <i class="bx bx-joystick-button" aria-hidden="true"></i>
          Consoles
        </a>
        <a class="subitem" href="/src/produtos.html?categoria=jogos">
          <i class="bx bx-disc" aria-hidden="true"></i>
          Jogos
        </a>
        <a class="subitem" href="/src/produtos.html?categoria=acessorios">
          <i class="bx bx-headphone" aria-hidden="true"></i>
          Acessórios
        </a>
        <a class="subitem" href="/src/produtos.html?categoria=pc-gamer">
          <i class="bx bx-desktop" aria-hidden="true"></i>
          PC Gamer
        </a>
        <a class="subitem" href="/src/produtos.html?categoria=colecionaveis">
          <i class="bx bx-trophy" aria-hidden="true"></i>
          Colecionáveis
        </a>
        <a class="subitem offers" href="/src/produtos.html">
          <b>%</b>
          Ofertas
        </a>
      </nav>
    </div>
